<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="날씨,나의날씨,서울날씨,전국날씨,오늘 서울 날씨,날씨예보,일기예보,지금서울,서울 눈,기상예보">
    <title>-2℃ 서울특별시 - 날씨예보</title>
    <link rel="shortcut icon" href="../image_video/images/weather_favicon.png" type="image/x-icon">
</head>
<body>
    <div id="wrap" style="background-image: url(./weather.images/bg1.jpg);">
        <div id="top_menu">
            <p class="my_area">나의 위치</p>
            <h1 class="area">서울</h1>
            <h1 class="temp">-2℃</h1>
            <h2 class="Sensory_temp">체감온도 : -8℃</h2>
            <div id="top_low_temp">
                <p class="top_temp"><em>최고</em> : 5℃</p>
                <p class="low_temp"><em>최저</em> : -5℃</p>
            </div>
        </div>
        <a href="#" id="notice">
            <h2><strong>폭설주의보</strong></h2>
            <p><strong>13시에서18시에 <br> 폭설이 예상됩니다.</strong></p>
        </a>
        <a href="#" id="bottom_menu">
            <p class="forecast">18시쯤 청명한 날씨가 예상됩니다.</p>
            <div id="weather_time_data">
                <div class="data">
                    <h3 class="time">지금</h3>
                    <p class="icon"><img src="./weather.images/cloud.png"></p>
                    <p class="temp">-3℃</p>
                </div>
                <div class="data">
                    <h3 class="time">10시</h3>
                    <p class="icon"><img src="./weather.images/cloud.png"></p>
                    <p class="temp">-1℃</p>
                </div>
                <div class="data">
                    <h3 class="time">12시</h3>
                    <p class="icon"><img src="./weather.images/rain.png"></p>
                    <p class="temp">2℃</p>
                </div>
            </div>
        </a>
    </div>
</body>
</html>
